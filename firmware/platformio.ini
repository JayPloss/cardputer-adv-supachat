[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/pre-upload-gate.py
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wl,--wrap=malloc,--wrap=free,--wrap=calloc,--wrap=realloc,--wrap=_free_r,--wrap=helix_malloc
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    ; Exact versions: M5GFX 0.3.0 turns the ADV's panel by itself, so with our setRotation(1) the picture came out turned.
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

[env:juju]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Juju\"
    -DSUPACHAT_DEVICE_ID=\"juju\"
    -DSUPACHAT_DEVICE_JUJU=1

[env:papa]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Papa\"
    -DSUPACHAT_DEVICE_ID=\"papa\"
    -DSUPACHAT_DEVICE_PAPA=1

[env:mama]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Mama\"
    -DSUPACHAT_DEVICE_ID=\"mama\"
    -DSUPACHAT_DEVICE_MAMA=1

[env:emmanuelle]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Emmanuelle\"
    -DSUPACHAT_DEVICE_ID=\"emmanuelle\"
    -DSUPACHAT_DEVICE_EMMANUELLE=1
    -DSUPACHAT_LANGUAGE_FR=1

[env:naomie]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Naomie\"
    -DSUPACHAT_DEVICE_ID=\"naomie\"
    -DSUPACHAT_DEVICE_NAOMIE=1
    -DSUPACHAT_LANGUAGE_FR=1

[env:andrew]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Andrew\"
    -DSUPACHAT_DEVICE_ID=\"andrew\"
    -DSUPACHAT_DEVICE_ANDREW=1
    -DSUPACHAT_LANGUAGE_FR=1

# The power lab: measures the battery under each load. Never a normal build.
[env:power-lab]
extends = env:cardputer-adv
build_src_filter = -<*> +<../lab/power_lab.cpp>
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

# The font lab: every candidate font on the real screen, for judging by eye. Never a normal build.
[env:font-lab]
extends = env:cardputer-adv
build_src_filter = -<*> +<../lab/font_lab.cpp>
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

# The real binary under Espressif's QEMU, for qemu/boot-check.sh in the emulator repo. Never flashed.
[env:qemu]
extends = env:cardputer-adv
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
build_flags =
    ${env:cardputer-adv.build_flags}
    -I include
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSUPACHAT_NO_RADIO=1
lib_deps =
    ${env:cardputer-adv.lib_deps}
    SD_MMC
build_src_flags =
    -include qemu_sd.h
    -DQEMU_AUTOPILOT
