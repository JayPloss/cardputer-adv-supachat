[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/pre-upload-gate.py
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1

[env:juju]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Juju\"
    -DSUPACHAT_DEVICE_ID=\"juju\"
    -DSUPACHAT_DEVICE_JUJU=1

[env:papa]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Papa\"
    -DSUPACHAT_DEVICE_ID=\"papa\"
    -DSUPACHAT_DEVICE_PAPA=1

[env:emmanuelle]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Emmanuelle\"
    -DSUPACHAT_DEVICE_ID=\"emmanuelle\"
    -DSUPACHAT_DEVICE_EMMANUELLE=1

[env:naomie]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSUPACHAT_DEVICE_NAME=\"Naomie\"
    -DSUPACHAT_DEVICE_ID=\"naomie\"
    -DSUPACHAT_DEVICE_NAOMIE=1
