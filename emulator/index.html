<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupaChat ADV Emulator</title><style>
:root{color-scheme:dark;font-family:Consolas,monospace;background:#0c100e;color:#f6f2dd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(980px,100%);display:grid;grid-template-columns:minmax(360px,720px) minmax(220px,1fr);gap:20px;align-items:start}.device{background:#1c211f;border:3px solid #555f59;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0008}h1{font-size:18px;color:#ffd83d;margin:0 0 12px}canvas{display:block;width:240px;height:135px;max-width:100%;image-rendering:pixelated;background:#000;border:2px solid #6d7771}.keyboard{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}button,input,select{font:700 13px Consolas;padding:10px;color:#fff;background:#183b2c;border:1px solid #779080;border-radius:6px;min-width:0}button:active{background:#71d66d;color:#000}#space{grid-column:span 3}.panel{background:#141a17;border:1px solid #354139;border-radius:12px;padding:14px;display:grid;gap:12px}.panel label{display:grid;gap:5px;color:#b9c1bc}.readout{font-size:11px;color:#90ffa3;overflow-wrap:anywhere;max-height:220px;overflow:auto}.hint{font-size:12px;color:#9ca59f;margin:0}@media(max-width:720px){body{padding:8px}main{grid-template-columns:1fr;gap:8px}.device{padding:8px}.keyboard{grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}button,input,select{padding:5px;font-size:11px}.panel{padding:8px;gap:5px}.readout{max-height:32px}.hint{font-size:10px}}
</style></head><body><main data-vi-container="true"><section class="device" data-vi-container="true"><h1>SUPACHAT · CARDPUTER ADV · ALBIE</h1><canvas id="screen" width="240" height="135" data-vi-container="true" aria-label="Cardputer 240 by 135 display"></canvas><div class="keyboard"><button data-key="LEFT">← MENU</button><button data-key="UP">↑ ;</button><button data-key="DOWN">↓ .</button><button data-key="RIGHT">→ /</button><button data-key="QUESTION">SHIFT + / = ?</button><button data-key="ENTER">ENTER</button><button data-key="BACKSPACE">DEL</button><button id="space">HOLD SPACE · PTT</button></div></section><aside class="panel"><label>Printable text<input id="text-entry" placeholder="Type chat/password characters"></label><label>Sync fault injection<select id="sync-result"><option value="ok">200 · synced</option><option value="io">I/O · -1</option><option value="auth">HTTP · 401</option><option value="bad-data">200 · bad JSON</option></select></label><div>Feedback tones: <output id="tone-count">0</output></div><p class="hint">The screen is rendered at the ADV’s exact 240×135 resolution. Controls use the same menu and modifier rules as firmware. ESP-NOW is disabled.</p><output id="state" class="readout"></output></aside></main><script type="module" src="ui.mjs"></script></body></html>
